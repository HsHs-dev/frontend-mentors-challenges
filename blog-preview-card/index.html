<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./index.css">

  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>

  <div class="card">
    <img class="illustration" src="./assets/images/illustration-article.svg" alt="learning illustration image">
    <div class="content">
      <p class="tag">Learning</p>
      <p class="date">Published 21 Dec 2023</p>
      <h2 class="title">HTML & CSS foundations</h2>
      <p class="desc">These languages are the backbone of every website, defining structure, content, and presentation.
      </p>
    </div>
    <div class="author">
      <img class="avatar" src="./assets/images/image-avatar.webp" alt="author avatar image">
      <p class="name">Greg Hooper</p>
    </div>
  </div>

</body>

</html>
