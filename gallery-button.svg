<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 170" width="600" height="170" role="img" aria-label="Gallery">
  <defs>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D68"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <a xlink:href="REPLACE_WITH_YOUR_LINK">
    <!-- navy backplate, peeking out behind for a layered two-tone look -->
    <rect x="32" y="32" width="560" height="120" rx="22" fill="#3E54A3"/>

    <!-- coral button on top, offset -->
    <rect x="20" y="20" width="560" height="120" rx="22" fill="url(#coral)"/>

    <text
      x="300" y="93"
      text-anchor="middle"
      font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
      font-weight="800"
      font-size="42"
      letter-spacing="5"
      fill="#FFFFFF"
    >GALLERY</text>
  </a>
</svg>
